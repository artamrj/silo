services:
  silo:
    image: ghcr.io/artamrj/silo:latest
    restart: unless-stopped
    ports:
      # Host Port : Container Port
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
        
      # If you want to use private registries, you need to share the auth file with Silo:
      # - /root/.docker/:/root/.docker

      # Stacks Directory
      # ⚠️ READ IT CAREFULLY. If you did it wrong, your data could end up writing into a WRONG PATH.
      # ⚠️ 1. FULL path only. No relative path (MUST)
      # ⚠️ 2. Left Stacks Path === Right Stacks Path (MUST)
      - /opt/stacks:/opt/stacks
    environment:
      # Tell Silo where is your stacks directory
      - SILO_STACKS_DIR=/opt/stacks
      - SILO_IS_CONTAINER=1
      # Enables the host shell console. Keep Silo restricted to trusted administrators.
      - SILO_ENABLE_CONSOLE=true
